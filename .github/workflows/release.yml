name: Release APK

# Pushing a tag like v1.0.0 on a commit of main runs the checks, builds a
# signed APK, attaches it to a GitHub Release as app-release.apk and sends it
# to the testers through Firebase App Distribution. A tag on any other commit
# fails before anything is built.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Public value, the same one shipped in android/app/google-services.json.
  FIREBASE_APP_ID: '1:291306693478:android:8ecddfafb3312a98665ea7'
  # Tester groups (aliases from the Firebase console), comma separated.
  # Override with the repository variable FIREBASE_TESTER_GROUPS.
  FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the next step can tell whether the tag is on main.
          fetch-depth: 0

      # Releases come only from reviewed code: the tagged commit must already
      # be part of main (merged through a pull request).
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Tag a commit of main."
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install Melos
        run: dart pub global activate melos 8.10.1

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      # Fail before building instead of silently publishing a debug-signed APK
      # or a release that never reaches the testers.
      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done

      - name: Restore keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > key.properties

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

      # Writes the key to a temp file and exports GOOGLE_APPLICATION_CREDENTIALS,
      # which firebase-tools picks up.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Distribute to Firebase testers
        run: |
          npx --yes firebase-tools@14.27.0 appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "Rick & Morty $GITHUB_REF_NAME — https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME"

      - name: Remove signing files
        if: always()
        working-directory: android
        run: rm -f app/upload-keystore.jks key.properties
