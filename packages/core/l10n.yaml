# flutter gen-l10n: one ARB for the whole app (every feature depends on core).
arb-dir: lib/l10n
template-arb-file: app_pt.arb
output-dir: lib/src/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
# Run dart format on the output, so CI's format check passes.
format: true
