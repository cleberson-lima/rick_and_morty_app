name: core
description: Rick and Morty app — core package.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.41.0"

dependencies:
  cached_network_image: ^4.0.6
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  assets:
    - assets/fonts/INTER_LICENSE
  fonts:
    # Inter 4.1 (SIL OFL 1.1), static weights used by the theme. Bundled so
    # the first launch offline or on a slow network doesn't fall back to
    # another font. See AppTheme.fontFamily.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # Phosphor icon fonts (MIT), see lib/src/ui/phosphor_icons.dart.
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
