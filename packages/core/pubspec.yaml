name: core
description: Rick and Morty app — core package.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.41.0"

dependencies:
  cached_network_image: ^4.0.6
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_modular: ^6.4.1
  freezed_annotation: ^3.1.0
  google_fonts: 8.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  auto_injector: ^2.2.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  mocktail: ^1.0.5

flutter:
  # Phosphor icon fonts (MIT), see lib/src/ui/phosphor_icons.dart.
  fonts:
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
