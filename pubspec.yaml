name: rick_and_morty_app
description: Search characters, episodes and locations from the Rick and Morty API.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.41.0"

# The app lives at the repository root; feature packages are local
# workspace members under packages/.
workspace:
  - packages/core
  - packages/favorites
  - packages/search

dependencies:
  flutter:
    sdk: flutter
  core: ^0.1.0
  favorites: ^0.1.0
  search: ^0.1.0
  flutter_bloc: ^9.1.1
  flutter_modular: ^6.4.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  melos: 8.10.1

flutter:
  uses-material-design: true

melos:
  scripts:
    analyze:
      description: Static analysis across the app and all packages.
      run: dart analyze --fatal-infos .
    format:
      description: Format all Dart files.
      run: dart format .
    gen:
      description: Run build_runner in every package that uses it.
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner
    test:
      description: Run tests in every package that has a test folder.
      exec: flutter test
      packageFilters:
        dirExists: test
    coverage:
      description: >-
        Run tests with coverage, merge into coverage/lcov.info (generated code
        excluded) and fail below 80% line coverage.
      run: >-
        melos exec --dir-exists=test -- flutter test --coverage &&
        dart run tool/coverage_report.dart --min=80
